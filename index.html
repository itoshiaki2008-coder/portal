/* 開いたページの中で動く見張り役：操作のたびに期限を延ばし、無操作が続いたら暗号画面へ戻す */
function guard(K,I){
 var EV=["pointerdown","pointermove","keydown","wheel","touchstart","scroll","input"],t0=0,timer=null,hooked=[];
 function ex(){try{var o=JSON.parse(sessionStorage.getItem(K)||"null");return o?o.e:0;}catch(e){return 0;}}
 function put(v){try{var o=JSON.parse(sessionStorage.getItem(K)||"null");if(o){o.e=v;sessionStorage.setItem(K,JSON.stringify(o));}}catch(e){}}
 function out(){try{sessionStorage.removeItem(K);}catch(e){}location.reload();}
 function arm(){clearTimeout(timer);var r=ex()-Date.now();timer=setTimeout(function(){if(ex()>Date.now()){arm();}else{out();}},Math.max(1000,r)+200);}
